name: Update nix-direnv

"on":
  schedule:
    - cron: "0 0 16 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-nix-direnv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update nix-direnv to the latest version
        run: nix run .#update-nix-direnv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the nix-direnv version and direnvrc checksum
        run: |
          version=$(grep --only-matching --perl-regexp 'nix_direnv_version \K[0-9.]+' .envrc)
          url_version=$(grep --only-matching --perl-regexp 'nix-direnv/\K[0-9.]+(?=/direnvrc)' .envrc)
          expected=$(grep --only-matching --perl-regexp '"\Ksha256-[A-Za-z0-9+/=]+' .envrc)
          if [[ "$version" != "$url_version" ]]; then
            echo "::error file=.envrc::nix_direnv_version $version does not match direnvrc URL version $url_version"
            exit 1
          fi
          actual="sha256-$(curl --fail --silent --show-error --location "https://raw.githubusercontent.com/nix-community/nix-direnv/$url_version/direnvrc" | openssl dgst -sha256 -binary | base64)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error file=.envrc::direnvrc checksum $expected does not match actual checksum $actual"
            exit 1
          fi
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          assignees: ${{ github.repository_owner }}
          branch: "update/nix-direnv"
          commit-message: "chore(deps): Update nix-direnv"
          title: "chore(deps): Update nix-direnv"
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        # Use the PAT so that the merge triggers the push workflows on main.
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
