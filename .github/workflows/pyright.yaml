name: Pyright
"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - '**.py'
      - .github/workflows/pyright.yaml
      - flake.lock
      - pyproject.toml
      - requirements-dev.txt

permissions:
  contents: read
  pull-requests: read

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '**.nix'
              - '**.py'
              - .github/workflows/pyright.yaml
              - flake.lock
              - pyproject.toml
              - requirements-dev.txt
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Cache Python virtual environment
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          key: venv-${{ runner.os }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('requirements-dev.txt') }}
          path: .venv
      - name: Check Python code with Pyright
        if: steps.gate.outputs.run == 'true'
        run: nix develop --command pyright --pythonpath .venv/bin/python --warnings
