name: Flake ❄️ Lock 🔒️ Updater ✨

"on":
  schedule:
    # Run on the third and eighteenth of the month.
    - cron: '0 0 3,18 * *'
  workflow_dispatch:

jobs:
  flake-lock-updater:
    name: Flake Lock Updater
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/update-flake-lock@v29
        id: update
        with:
          pr-assignees: ${{ github.repository_owner }}
          pr-labels: |
            automated
            dependencies
          pr-title: "chore: update flake.lock"
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number
        # Use the PAT so that the merge triggers the push workflows on main.
        run: gh pr merge --auto --merge "${{ steps.update.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
