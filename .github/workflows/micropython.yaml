name: MicroPython

"on":
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    paths:
      - '**.nix'
      - .github/workflows/micropython.yaml
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  micropython:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - '**.nix'
              - .github/workflows/micropython.yaml
              - flake.lock
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      - name: Build
        if: steps.gate.outputs.run == 'true'
        run: nix build .#micropython
      - name: Upload MicroPython
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: micropython
          path: |
            result/bin/RPI_PICO.uf2
